<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>YouGame Beta Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm reading column. Plain notes for the developer sit on light "paper";
   agent prompts sit in dark terminal panels so the two never blur together. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --ink: #16201b;
  --muted: #5a6660;
  --line: #dde3df;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --agent-bg: #18211e;
  --agent-ink: #d9e6e0;
  --agent-label: #8fd6bb;
  --agent-line: #2b3833;
  --sev-critical: #b42318;
  --sev-high: #b9510b;
  --sev-medium: #8a6a00;
  --sev-low: #55645d;
  --ok: #1d6b57;
  --warn: #8a6a00;
  --no: #8b3a3a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #161e1b; --ink: #e5ebe8; --muted: #9ba7a1; --line: #29342f;
    --accent: #5fc7a5; --accent-ink: #0b1411; --accent-soft: #1b3129;
    --agent-bg: #0a0e0d; --agent-ink: #d0e0d8; --agent-label: #7fd5b4; --agent-line: #24302b;
    --sev-critical: #ff8676; --sev-high: #ffa45e; --sev-medium: #e3bf55; --sev-low: #a5b2ac;
    --ok: #5fc7a5; --warn: #e3bf55; --no: #f09a9a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161e1b; --ink: #e5ebe8; --muted: #9ba7a1; --line: #29342f;
  --accent: #5fc7a5; --accent-ink: #0b1411; --accent-soft: #1b3129;
  --agent-bg: #0a0e0d; --agent-ink: #d0e0d8; --agent-label: #7fd5b4; --agent-line: #24302b;
  --sev-critical: #ff8676; --sev-high: #ffa45e; --sev-medium: #e3bf55; --sev-low: #a5b2ac;
  --ok: #5fc7a5; --warn: #e3bf55; --no: #f09a9a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.1; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Header */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro .lede { color: var(--muted); max-width: 60ch; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 13.5px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.tag-human, .tag-agent {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.tag-human { background: var(--accent-soft); color: var(--accent); }
.tag-agent { background: var(--agent-bg); color: var(--agent-label); font-family: var(--font-mono); text-transform: none; letter-spacing: 0; font-weight: 500; }

.banner {
  border: 1px dashed var(--line); background: var(--surface); border-radius: var(--r);
  padding: 12px 14px; font-size: 14px; color: var(--muted);
}
.banner strong { color: var(--ink); }

/* Progress */
.progress { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.meter .num { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter .num small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* Tabs + toolbar */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; padding: 10px 14px 12px; font-weight: 600; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-size: 12px; font-weight: 600; background: var(--line); color: var(--ink); border-radius: 99px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 13.5px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px;
  font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-agent { background: var(--agent-bg); color: var(--agent-label); border-color: var(--agent-line); font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; }
.btn-agent:hover { border-color: var(--agent-label); }

/* List */
.list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item.is-closed .row-title { color: var(--muted); }
.row {
  width: 100%; background: none; border: 0; text-align: left; padding: 14px 16px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center;
}
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.row-id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-title { font-weight: 600; font-size: 15.5px; line-height: 1.35; }
.row-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; color: var(--muted); align-items: center; }
.sev { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.sev-critical { color: var(--sev-critical); } .sev-high { color: var(--sev-high); }
.sev-medium { color: var(--sev-medium); } .sev-low { color: var(--sev-low); }
.status {
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--line); color: var(--muted);
}
.status.s-fixed, .status.s-agree, .status.s-done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.status.s-fixing, .status.s-later { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.status.s-wontfix, .status.s-disagree { color: var(--no); border-color: color-mix(in srgb, var(--no) 40%, transparent); background: color-mix(in srgb, var(--no) 8%, transparent); }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .2s; }
.row[aria-expanded="true"] .chev { transform: rotate(-135deg); margin: 4px 4px 0 0; }
.row-end { display: flex; align-items: center; gap: 12px; }

/* Detail */
.detail { border-top: 1px solid var(--line); padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 20px; }
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.prose { max-width: 66ch; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pair.compare > div { padding: 10px; gap: 8px; }
.pair.compare img { border-radius: 6px; }
.pair.compare img { cursor: zoom-in; }
.pair.compare.zoom { grid-template-columns: minmax(0, 1fr); }
.pair.compare.zoom img { cursor: zoom-out; }
.pair .exp .label { color: var(--ok); } .pair .act .label { color: var(--sev-critical); }
.evidence { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.evidence li { border-left: 2px solid var(--line); padding-left: 12px; overflow-wrap: anywhere; }
.evidence img, .shot img, .pair.compare img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
.evidence figcaption, .shot figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
.evidence figure, .shot figure { margin: 0; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.thumb { padding: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; overflow: hidden; text-align: left; display: flex; flex-direction: column; }
.thumb img { width: 100%; height: 140px; object-fit: cover; object-position: top; display: block; border: 0; border-radius: 0; }
.thumb span { font-size: 12.5px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
.thumb:hover { border-color: var(--muted); }
.thumb.zoom { grid-column: 1 / -1; }
.thumb.zoom img { height: auto; }
.evidence li:has(.gallery) { border-left: 0; padding-left: 0; }
.evidence code { font-family: var(--font-mono); font-size: 13px; }
a { color: var(--accent); text-underline-offset: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }

.agent { background: var(--agent-bg); color: var(--agent-ink); border: 1px solid var(--agent-line); border-radius: var(--r); overflow: hidden; }
.agent-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--agent-line); flex-wrap: wrap; }
.agent-head .who { font-family: var(--font-mono); font-size: 12.5px; color: var(--agent-label); }
.agent-head .who span { color: color-mix(in srgb, var(--agent-ink) 60%, transparent); }
.agent pre { margin: 0; padding: 14px; font: 13px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }

.respond { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.respond h3 { font-size: 16px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button:disabled { cursor: default; opacity: .6; }
textarea {
  width: 100%; min-height: 72px; resize: vertical; font: 14.5px/1.5 var(--font-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.note-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.saved { font-size: 13px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
}

@media (max-width: 560px) {
  .progress, .pair { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row-id { grid-column: 1 / -1; }
  .row-end .chev { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="intro">
    <div class="eyebrow">YouGame &middot; beta review</div>
    <h1>Beta review board</h1>
    <p class="lede">Bugs found while beta testing and suggestions for the design. Open any item to read it, then set its status or leave a note.</p>
    <div class="legend" aria-label="How to read this page">
      <span><span class="tag-human">For you</span> Plain-language notes</span>
      <span><span class="tag-agent">&gt;_ for agents</span> Prompts to copy into your coding agent</span>
    </div>
  </header>

  <div id="banners"></div>

  <section class="progress" aria-label="Progress">
    <div class="meter"><div class="num" id="bugNum">–</div><div class="bar"><i id="bugBar" style="width:0"></i></div></div>
    <div class="meter"><div class="num" id="uxNum">–</div><div class="bar"><i id="uxBar" style="width:0"></i></div></div>
  </section>

  <main>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-bugs" aria-selected="true" aria-controls="panel">Bugs <span class="count" id="countBugs">0</span></button>
      <button class="tab" role="tab" id="tab-ux" aria-selected="false" aria-controls="panel">Design ideas <span class="count" id="countUx">0</span></button>
    </div>
    <div id="panel" role="tabpanel">
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <button class="btn btn-agent" id="copyAll" type="button">&gt;_ Copy open prompts</button>
      </div>
      <ul class="list" id="list"><li class="empty">Loading findings…</li></ul>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const BUG_STATUS = [
    ["open", "Open"], ["fixing", "Working on it"], ["fixed", "Fixed"], ["wontfix", "Won't fix"]
  ];
  const UX_STATUS = [
    ["agree", "Will do"], ["later", "Maybe later"], ["disagree", "Not for us"], ["done", "Done"]
  ];
  const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
  const FILTERS = {
    bugs: [["all", "All"], ["open", "Open"], ["closed", "Closed"]],
    ux: [["all", "All"], ["todo", "Needs your take"], ["answered", "Answered"]]
  };

  const state = {
    bugs: [], ux: [], sample: { bugs: false, ux: false },
    responses: {}, tab: "bugs", filter: { bugs: "open", ux: "all" },
    open: null, db: null, canWrite: null, dbState: "loading", drafts: {}, loadError: null
  };

  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };

  // ---------- data ----------
  const asItems = (j) => Array.isArray(j) ? j : (j.items || j.bugs || j.points || []);
  const isSample = (j) => !Array.isArray(j) && !!j.sample;
  const cap = (t) => { t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); };
  const asList = (v) => v == null || v === "" ? [] : Array.isArray(v) ? v : [v];

  async function loadJSON(path) {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) throw new Error(path + " returned " + r.status);
    return r.json();
  }
  async function loadData() {
    try {
      const [b, u] = await Promise.all([loadJSON("data/bugs.json"), loadJSON("data/ux.json")]);
      state.bugs = asItems(b); state.ux = asItems(u);
      state.sample = { bugs: isSample(b), ux: isSample(u) };
    } catch (e) {
      state.loadError = "The findings could not be loaded (" + e.message + "). Reload the page to try again.";
    }
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) {
      if (state.ux.some((x) => x.id === h)) state.tab = "ux";
      if (state.bugs.some((x) => x.id === h) || state.ux.some((x) => x.id === h)) { state.open = h; state.filter[state.tab] = "all"; }
    }
    render();
  }

  // ---------- responses (shared, saved for everyone) ----------
  const resp = (id) => state.responses[id] || {};
  const bugStatus = (b) => resp(b.id).status || (b.status === "fixed" ? "fixed" : "open");
  const uxStatus = (u) => resp(u.id).status || "";
  const isClosedBug = (b) => ["fixed", "wontfix"].includes(bugStatus(b));

  async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") { state.dbState = "none"; render(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) { state.dbState = "none"; render(); return; }
    state.db = db;
    try { const c = user && user.can ? await user.can("data.write") : null; state.canWrite = c; } catch { state.canWrite = null; }
    db.collection("responses").onSnapshot((snap) => {
      const next = {};
      for (const d of snap.docs) next[d.id] = d.data();
      state.responses = next; state.dbState = "ready"; render();
    }, (err) => { state.dbState = err && err.code === "revoked" ? "none" : "error"; render(); });
  }

  const writable = () => state.db && state.dbState === "ready" && state.canWrite !== false;

  async function save(id, kind, patch) {
    if (!writable()) return;
    const body = { ...resp(id), ...patch, kind, updatedAt: new Date().toISOString() };
    try {
      await state.db.collection("responses").doc(id).set(body);
      return true;
    } catch (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; render(); toast("You can read this board but not change it."); }
      else toast("That didn't save. Check your connection and try again.");
      return false;
    }
  }

  // ---------- helpers ----------
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
  }
  async function copy(text, done) {
    try { await navigator.clipboard.writeText(text); toast(done); }
    catch {
      const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch {}
      ta.remove(); toast(ok ? done : "Copy was blocked. Select the prompt text and copy it by hand.");
    }
  }
  const isImg = (u) => /^data:image\//.test(u) || /\.(png|jpe?g|gif|webp|svg|avif)(\?.*)?$/i.test(u);
  const isUrl = (u) => typeof u === "string" && /^(https?:\/\/|\.?\/?[\w-]+\/[\w./-]+\.\w+$)/i.test(u.trim());

  function media(src, caption, fallbackLabel) {
    const fig = el("figure");
    const img = el("img", { src, alt: caption || fallbackLabel || "Screenshot", loading: "lazy" });
    img.addEventListener("error", () => fig.replaceChildren(el("a", { href: src, target: "_blank", rel: "noopener" }, caption || fallbackLabel || src)));
    fig.append(img);
    if (caption) fig.append(el("figcaption", { text: caption }));
    return fig;
  }

  function evidenceNode(e) {
    if (typeof e === "string") {
      const s = e.trim();
      if (isUrl(s)) return isImg(s) ? media(s, "") : el("a", { href: s, target: "_blank", rel: "noopener" }, s);
      return el("span", { text: s });
    }
    const src = e.image || e.src || e.screenshot || e.url || "";
    const cap = e.caption || e.label || e.note || "";
    if (src && (isImg(src) || e.type === "image")) return media(src, cap);
    const parts = [];
    if (e.label) parts.push(el("strong", { text: e.label + (e.text || src ? ": " : "") }));
    if (src) parts.push(el("a", { href: src, target: "_blank", rel: "noopener" }, e.text || src));
    else if (e.text) parts.push(/\n|[{}();]/.test(e.text) ? el("code", { text: e.text }) : document.createTextNode(e.text));
    if (e.note && e.label) parts.push(el("div", { class: "saved", text: e.note }));
    return el("span", {}, parts);
  }

  // Screenshot thumbnails; click one to see it full width.
  function shotLabel(src) {
    const f = String(src).split("/").pop().replace(/\.\w+$/, "");
    if (/fullpage/i.test(f)) return "Full page";
    const m = f.match(/detail(\d*)/i);
    if (m) return "Close-up" + (m[1] && m[1] !== "1" ? " " + m[1] : "");
    if (/page$/i.test(f)) return "Page";
    return "Screenshot";
  }
  function gallery(list) {
    const g = el("div", { class: "gallery" });
    for (const x of list) {
      const src = typeof x === "string" ? x : (x.src || x.path || x.url);
      const cap = (typeof x === "object" && x.caption) || shotLabel(src);
      const img = el("img", { src, alt: cap, loading: "lazy" });
      const b = el("button", { type: "button", class: "thumb", "aria-expanded": "false", title: "Show full size" }, img, el("span", { text: cap }));
      img.addEventListener("error", () => b.replaceWith(el("a", { href: src, target: "_blank", rel: "noopener" }, cap)));
      b.addEventListener("click", () => { const on = b.classList.toggle("zoom"); b.setAttribute("aria-expanded", on); b.title = on ? "Show smaller" : "Show full size"; });
      g.append(b);
    }
    return g;
  }

  // Evidence may be a list of strings/objects, or {screenshots, notes, console}.
  function evidenceList(ev) {
    if (ev && typeof ev === "object" && !Array.isArray(ev)) {
      return [
        ...(asList(ev.screenshots).length ? [gallery(asList(ev.screenshots))] : []),
        ...asList(ev.notes).map((n) => el("span", { text: n })),
        ...asList(ev.console).map((c) => el("span", {}, el("strong", { text: "Console: " }), el("code", { text: c })))
      ];
    }
    return asList(ev).map(evidenceNode);
  }

  // ---------- render ----------
  function render() {
    const active = document.activeElement;
    const focusId = active && active.id;
    const sel = active && active.tagName === "TEXTAREA" ? [active.selectionStart, active.selectionEnd] : null;

    renderBanners(); renderProgress(); renderTabs(); renderFilters(); renderList();

    if (focusId) {
      const n = document.getElementById(focusId);
      if (n) { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) n.setSelectionRange(sel[0], sel[1]); }
    }
  }

  function renderBanners() {
    const box = $("#banners"); box.replaceChildren();
    const add = (strong, rest) => box.append(el("p", { class: "banner" }, el("strong", { text: strong }), " " + rest));
    if (state.loadError) add("Couldn't load findings.", state.loadError);
    const s = state.sample;
    if (s.bugs && s.ux) add("These are example items.", "Real findings from beta testing and the design review will replace them here soon.");
    else if (s.bugs) add("The bugs shown are examples.", "Real bugs from beta testing will replace them here soon. The design ideas are real.");
    else if (s.ux) add("The design ideas shown are examples.", "Real design ideas will replace them here soon. The bugs are real.");
    if (state.dbState === "none") add("Read-only copy.", "Statuses and notes can only be saved on the shared review link, so the buttons here are off.");
    else if (state.dbState === "error") add("Saving is paused.", "The connection to saved responses dropped. Reload the page to reconnect.");
    else if (state.dbState === "ready" && state.canWrite === false) add("View only.", "You can read everything, but your access level doesn't allow changing statuses or notes. Ask the owner for edit access.");
  }

  function renderProgress() {
    const b = state.bugs, u = state.ux;
    const fixed = b.filter(isClosedBug).length;
    const answered = u.filter((x) => uxStatus(x)).length;
    $("#bugNum").replaceChildren(`${fixed} of ${b.length} `, el("small", { text: "bugs closed" }));
    $("#uxNum").replaceChildren(`${answered} of ${u.length} `, el("small", { text: "design ideas answered" }));
    $("#bugBar").style.width = b.length ? (fixed / b.length * 100) + "%" : "0";
    $("#uxBar").style.width = u.length ? (answered / u.length * 100) + "%" : "0";
  }

  function renderTabs() {
    $("#tab-bugs").setAttribute("aria-selected", state.tab === "bugs");
    $("#tab-ux").setAttribute("aria-selected", state.tab === "ux");
    $("#countBugs").textContent = state.bugs.filter((b) => !isClosedBug(b)).length;
    $("#countUx").textContent = state.ux.filter((u) => !uxStatus(u)).length;
    $("#countBugs").title = "Open bugs"; $("#countUx").title = "Ideas waiting for your take";
    const prompts = currentPrompts();
    const btn = $("#copyAll");
    btn.textContent = state.tab === "bugs" ? ">_ Copy prompts for open bugs" : ">_ Copy prompts for accepted ideas";
    btn.disabled = prompts.length === 0;
    btn.title = prompts.length ? `Copies ${prompts.length} agent prompt${prompts.length > 1 ? "s" : ""} as one message` : "Nothing to copy in this view yet";
  }

  function currentPrompts() {
    if (state.tab === "bugs") return state.bugs.filter((b) => !isClosedBug(b) && b.agent_prompt);
    return state.ux.filter((u) => u.agent_prompt && uxStatus(u) === "agree");
  }

  function renderFilters() {
    const box = $("#filters"); box.replaceChildren();
    for (const [key, label] of FILTERS[state.tab]) {
      box.append(el("button", {
        class: "chip", type: "button", "aria-pressed": state.filter[state.tab] === key,
        onclick: () => { state.filter[state.tab] = key; render(); }
      }, label));
    }
  }

  function visibleItems() {
    const f = state.filter[state.tab];
    if (state.tab === "bugs") {
      let xs = state.bugs;
      if (f === "open") xs = xs.filter((b) => !isClosedBug(b));
      if (f === "closed") xs = xs.filter(isClosedBug);
      return [...xs].sort((a, b) => (isClosedBug(a) - isClosedBug(b)) || ((SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9)));
    }
    let xs = [...state.ux].sort((a, b) => (SEV_ORDER[a.priority] ?? 9) - (SEV_ORDER[b.priority] ?? 9));
    if (f === "todo") xs = xs.filter((u) => !uxStatus(u));
    if (f === "answered") xs = xs.filter((u) => uxStatus(u));
    return xs;
  }

  function renderList() {
    const list = $("#list"); list.replaceChildren();
    if (state.loadError) { list.append(el("li", { class: "empty", text: "Nothing to show until the findings load." })); return; }
    const items = visibleItems();
    if (!items.length) {
      const all = state.tab === "bugs" ? state.bugs : state.ux;
      const msg = !all.length ? (state.tab === "bugs" ? "No bugs recorded yet." : "No design ideas recorded yet.")
        : state.tab === "bugs" && state.filter.bugs === "open" ? "Every bug is closed. Nice work."
        : "Nothing matches this filter.";
      list.append(el("li", { class: "empty", text: msg }));
      return;
    }
    for (const it of items) list.append(state.tab === "bugs" ? bugItem(it) : uxItem(it));
  }

  function statusPill(kind, value) {
    const map = Object.fromEntries(kind === "bug" ? BUG_STATUS : UX_STATUS);
    if (!value) return el("span", { class: "status", text: "Needs your take" });
    return el("span", { class: "status s-" + value, text: map[value] || value });
  }

  function rowButton(it, metaKids, pill) {
    const open = state.open === it.id;
    return el("button", {
      class: "row", type: "button", "aria-expanded": open, "aria-controls": "d-" + it.id,
      onclick: () => { state.open = open ? null : it.id; render(); }
    },
      el("span", { class: "row-id", text: it.id }),
      el("span", { class: "row-main" }, el("span", { class: "row-title", text: it.title }), el("span", { class: "row-meta" }, metaKids)),
      el("span", { class: "row-end" }, pill, el("span", { class: "chev", "aria-hidden": "true" }))
    );
  }

  function section(label, ...kids) {
    return el("div", { class: "section" }, el("div", { class: "section-head" }, el("span", { class: "label", text: label })), kids);
  }
  const prose = (t) => el("p", { class: "prose", text: t });

  function agentBlock(it, label) {
    return el("div", { class: "section" },
      el("div", { class: "agent" },
        el("div", { class: "agent-head" },
          el("span", { class: "who" }, ">_ for agents ", el("span", { text: "\u00b7 " + label })),
          el("button", { class: "btn btn-agent", type: "button", onclick: () => copy(it.agent_prompt, "Prompt copied. Paste it into your coding agent.") }, "Copy prompt")
        ),
        el("pre", { text: it.agent_prompt })
      )
    );
  }

  function respondBlock(it, kind) {
    const options = kind === "bug" ? BUG_STATUS : UX_STATUS;
    const current = kind === "bug" ? bugStatus(it) : uxStatus(it);
    const can = writable();
    const r = resp(it.id);
    const draftKey = it.id;
    const noteId = "note-" + it.id;
    const draft = state.drafts[draftKey] ?? r.note ?? "";
    const savedText = r.updatedAt ? "Last saved " + new Date(r.updatedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";

    const ta = el("textarea", {
      id: noteId, placeholder: kind === "bug" ? "Anything to add? For example, how you fixed it or why you won't." : "What do you think? Agree, push back, or suggest a different direction.",
      disabled: !can
    });
    ta.value = draft;
    const saveBtn = el("button", { class: "btn primary", type: "button", disabled: !can || draft === (r.note || "") }, "Save note");
    ta.addEventListener("input", () => {
      state.drafts[draftKey] = ta.value;
      saveBtn.disabled = ta.value === (resp(it.id).note || "");
    });
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      if (await save(it.id, kind, { note: ta.value })) { delete state.drafts[draftKey]; toast("Note saved"); }
    });

    return el("div", { class: "respond" },
      el("div", { class: "section-head" }, el("h3", { text: kind === "bug" ? "Your status" : "Your take" }), el("span", { class: "tag-human", text: "For you" })),
      el("div", { class: "seg", role: "group", "aria-label": kind === "bug" ? "Bug status" : "Your response" },
        options.map(([key, label]) => el("button", {
          type: "button", "aria-pressed": current === key, disabled: !can,
          onclick: async () => {
            const next = kind === "ux" && current === key ? "" : key;
            if (await save(it.id, kind, { status: next })) toast(next ? `Marked "${label}"` : "Cleared");
          }
        }, label))
      ),
      ta,
      el("div", { class: "note-row" }, saveBtn, el("span", { class: "saved", text: savedText }))
    );
  }

  function bugItem(b) {
    const st = bugStatus(b);
    const li = el("li", { class: "item" + (isClosedBug(b) ? " is-closed" : ""), id: "item-" + b.id });
    li.append(rowButton(b, [
      b.severity ? el("span", { class: "sev sev-" + String(b.severity).toLowerCase(), text: cap(b.severity) }) : null,
      b.area ? el("span", { text: b.area }) : null,
      b.status === "needs_screenshot" ? el("span", { text: "Screenshot coming" }) : null,
      b.status === "fixed" ? el("span", { text: "Already fixed on the live site" }) : null
    ], statusPill("bug", st)));
    if (state.open !== b.id) return li;

    const d = el("div", { class: "detail", id: "d-" + b.id });
    if (b.summary) d.append(section("What's wrong", prose(b.summary)));
    if (b.url || b.page_url) d.append(el("div", { class: "links" }, el("a", { class: "btn", href: b.url || b.page_url, target: "_blank", rel: "noopener" }, "Open the page \u2197")));
    const steps = asList(b.steps);
    if (steps.length) d.append(section("How to see it", steps.length > 1 ? el("ol", { class: "steps" }, steps.map((s) => el("li", { text: s }))) : prose(steps[0])));
    if (b.expected || b.actual) d.append(el("div", { class: "pair" },
      el("div", { class: "exp" }, el("span", { class: "label", text: "Should happen" }), el("span", { text: b.expected || "—" })),
      el("div", { class: "act" }, el("span", { class: "label", text: "Actually happens" }), el("span", { text: b.actual || "—" }))
    ));
    const ev = evidenceList(b.evidence);
    if (ev.length) d.append(section("Evidence", el("ul", { class: "evidence" }, ev.map((e) => el("li", {}, e)))));
    if (b.agent_prompt) d.append(agentBlock(b, "proposed fix"));
    d.append(respondBlock(b, "bug"));
    li.append(d);
    return li;
  }

  function uxItem(u) {
    const li = el("li", { class: "item" + (uxStatus(u) === "done" || uxStatus(u) === "disagree" ? " is-closed" : ""), id: "item-" + u.id });
    li.append(rowButton(u, [
      u.priority ? el("span", { class: "sev sev-" + String(u.priority).toLowerCase(), text: cap(u.priority) + " priority" }) : null,
      u.area ? el("span", { text: u.area }) : null
    ], statusPill("ux", uxStatus(u))));
    if (state.open !== u.id) return li;

    const d = el("div", { class: "detail", id: "d-" + u.id });
    if (u.problem) d.append(section("What we noticed", prose(u.problem)));
    if (u.page_url) d.append(el("div", { class: "links" }, el("a", { class: "btn", href: u.page_url, target: "_blank", rel: "noopener" }, "See this on YouGame \u2197")));
    if (u.why_it_matters) d.append(section("Why it matters", prose(u.why_it_matters)));
    if (u.recommendation) d.append(section("Suggestion", prose(u.recommendation)));
    const shotOf = (x, cap) => typeof x === "string" ? media(x, "", cap) : media(x.src || x.url || x.path, x.caption || "", cap);
    const before = asList(u.before_screenshot), after = asList(u.after_image);
    if (before.length && after.length) {
      const cmp = el("div", { class: "pair compare", title: "Click to enlarge" },
        el("div", {}, el("span", { class: "label", text: "Today" }), before.map((x) => shotOf(x, "Current screen"))),
        el("div", {}, el("span", { class: "label", text: "Proposed" }), after.map((x) => shotOf(x, "Redesign mock"))));
      cmp.addEventListener("click", (e) => { if (e.target.tagName === "IMG") { const on = cmp.classList.toggle("zoom"); cmp.title = on ? "Click to shrink" : "Click to enlarge"; } });
      d.append(section("Today and proposed", cmp));
    } else if (before.length) {
      d.append(section("Today", el("div", { class: "shot" }, before.map((x) => shotOf(x, "Current screen")))));
    } else if (after.length) {
      d.append(section("Proposed redesign", el("div", { class: "shot" }, after.map((x) => shotOf(x, "Redesign mock")))));
    }
    const figs = asList(u.figma_url);
    if (figs.length) d.append(section("Redesign mocks",
      el("div", { class: "links" }, figs.map((f, i) => {
        const href = typeof f === "string" ? f : f.url;
        const label = typeof f === "string" ? (figs.length > 1 ? `Open option ${String.fromCharCode(65 + i)} in Figma` : "Open mock in Figma") : (f.label || "Open in Figma");
        return el("a", { class: "btn", href, target: "_blank", rel: "noopener" }, label + " \u2197");
      }))));
    if (u.agent_prompt) d.append(agentBlock(u, "implementation brief"));
    d.append(respondBlock(u, "ux"));
    li.append(d);
    return li;
  }

  // ---------- wiring ----------
  $("#tab-bugs").addEventListener("click", () => { state.tab = "bugs"; render(); });
  $("#tab-ux").addEventListener("click", () => { state.tab = "ux"; render(); });
  $("#copyAll").addEventListener("click", () => {
    const ps = currentPrompts();
    if (!ps.length) return;
    const head = state.tab === "bugs"
      ? `Fix these ${ps.length} YouGame bugs, one at a time, in order of severity. Each section is self-contained.`
      : `Implement these ${ps.length} YouGame design changes, one at a time. Each section is self-contained.`;
    const body = ps.map((p) => `## ${p.id}: ${p.title}\n\n${p.agent_prompt}`).join("\n\n---\n\n");
    copy(head + "\n\n" + body, `Copied ${ps.length} prompt${ps.length > 1 ? "s" : ""}. Paste into your coding agent.`);
  });

  render();
  loadData();
  connect();
})();
</script>

</body>
</html>
